<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Créer l'appli GitHub Kollab</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f4ff; color: #1b1740; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 420px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #4b4670; }
  button { border: 0; border-radius: 12px; padding: 14px 22px; background: #5b4cf0; color: #fff; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  button:hover { background: #4a3bdc; }
  label { display: block; margin: 0 0 20px; text-align: left; font-weight: 600; }
  input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 12px; border: 2px solid #d9d5ff; border-radius: 10px; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <h1>Appli GitHub Kollab</h1>
  <p>Un clic ici, un clic sur GitHub. Ensuite tu choisis les dépôts que Kollab peut voir.</p>
  <form id="f" method="post">
    <label>Nom de l'appli sur GitHub
      <input id="name" value="Kollab Projets" maxlength="34" required>
    </label>
    <input type="hidden" name="manifest" id="manifest">
    <button type="submit">Créer sur GitHub</button>
  </form>
</main>
<script>
  // Page à usage unique : le code k vient de la base, la fonction « github » le vérifie au retour.
  var FN = 'https://wwotsleenolxjduzxvzk.supabase.co/functions/v1/github'
  var SITE = 'https://kollab-tan-nu.vercel.app'
  var k = new URLSearchParams(location.search).get('k') || ''
  var f = document.getElementById('f')
  f.action = 'https://github.com/settings/apps/new?state=' + encodeURIComponent(k)
  f.addEventListener('submit', function () {
    document.getElementById('manifest').value = JSON.stringify({
      name: document.getElementById('name').value,
      url: SITE,
      hook_attributes: { url: SITE, active: false },
      redirect_url: FN + '/setup',
      callback_urls: [FN + '/callback'],
      setup_url: FN + '/installed',
      setup_on_update: true,
      request_oauth_on_install: false,
      public: true,
      // Le strict nécessaire : PR, revues, commentaires, branches des tâches, checks et relance de la CI.
      default_permissions: { metadata: 'read', contents: 'write', pull_requests: 'write', issues: 'write', checks: 'read', statuses: 'read', actions: 'write' },
      default_events: []
    })
  })
</script>
</body>
</html>
