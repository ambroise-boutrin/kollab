name: Appli bureau

# Une étiquette vX.Y.Z publie une release avec les installeurs Windows, macOS et Linux.
# Sur une PR qui touche l'appli bureau, on vérifie seulement que tout compile.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['src-tauri/**', '.github/workflows/desktop.yml', 'package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Adresse et clé publique du projet Supabase (faites pour être visibles côté client).
          VITE_SUPABASE_URL: https://wwotsleenolxjduzxvzk.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_aQpShvIsm1OZeH6En83LMw_bL1T4Kai
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Kollab ${{ github.ref_name }}
          releaseBody: Télécharge l'installeur de ton système ci-dessous (Windows, macOS ou Linux).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
